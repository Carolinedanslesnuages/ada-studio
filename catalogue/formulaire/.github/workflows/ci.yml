name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Anti-fuite (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks 8.30.1 (binaire vérifié)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --verbose .

  api:
    name: API (lint, tests, compilation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  front:
    name: Front (lint, types, tests dont accessibilité, compilation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npx oxlint .
      - run: npx eslint .
      - run: npm run type-check
      - run: npm run test:unit -- --run
      - run: npm run build-only
      - name: Storybook (les stories sont aussi testées par les tests unitaires)
        run: npm run build-storybook

  image:
    name: Image et chart (construction, helm lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Image de production (Dockerfile)
        run: docker build --build-arg VERSION="$(cat version.txt)" --build-arg COMMIT="$GITHUB_SHA" -t application .
      - name: L'image démarre et répond
        run: |
          docker run -d --name application -p 8080:8080 application
          for _ in $(seq 1 30); do curl -sf http://localhost:8080/api && exit 0; sleep 1; done
          docker logs application; exit 1
      - name: Chart Helm (si le projet est déployé)
        if: hashFiles('charts/app/Chart.yaml') != ''
        run: |
          curl -sSfL -o helm.tgz https://get.helm.sh/helm-v4.2.3-linux-amd64.tar.gz
          echo "e9b88b4ee95b18c706839c28d3a0220e5bc470e9cd9262410c90793c45ff8b7c  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz linux-amd64/helm
          ./linux-amd64/helm lint --strict charts/app
          ./linux-amd64/helm template verification charts/app --set ingress.enabled=true --set ingress.host=exemple.gouv.fr > /dev/null
