apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.nomComplet" . }}
  labels:
    {{- include "app.etiquettes" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # SQLite : jamais deux instances sur le même fichier, même pendant une mise à jour.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "app.selecteurs" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.etiquettes" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: PORT
              value: "8080"
            - name: FICHIER_BASE
              value: /donnees/app.db
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: donnees
              mountPath: /donnees
            - name: temporaire
              mountPath: /tmp
      volumes:
        - name: donnees
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "app.nomComplet" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: temporaire
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
