apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.nomComplet" . }}
  labels:
    {{- include "app.etiquettes" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "app.selecteurs" . | nindent 4 }}
